<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidLabs Quantum Window — Holo Filter Lens</title>
    <meta name="description" content="SidLabs Quantum Window — Real-time AI hand-tracked holographic filter lens with 10 GPU shader presets.">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #0a0a10;
            --panel-bg: rgba(18, 18, 28, 0.88);
            --panel-border: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.03);
            --accent: #c9a87c;
            --accent-dim: rgba(201,168,124,0.5);
            --accent-glow: rgba(201,168,124,0.25);
            --red: #ff4444;
            --green: #00ff88;
            --cyan: #00d4ff;
            --text: #f0f0f5;
            --text-dim: #6a6a82;
            --text-mid: #9a9ab0;
            --btn-bg: rgba(255,255,255,0.04);
            --btn-border: rgba(255,255,255,0.08);
            --btn-hover: rgba(255,255,255,0.08);
            --btn-active: rgba(201,168,124,0.15);
            --btn-active-border: rgba(201,168,124,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw; height: 100vh;
            cursor: crosshair;
            display: flex;
        }

        /* --- Loading Overlay --- */
        #loading-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 2.5px solid rgba(255,255,255,0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            font-size: 12px; font-weight: 400;
            letter-spacing: 3px; text-transform: uppercase;
            color: var(--text-dim);
        }

        /* --- Main Canvas Area --- */
        #canvas-area {
            flex: 1; position: relative;
            background: #000;
            overflow: hidden;
        }
        #output-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
        }
        video#webcam { display: none; }

        /* --- Right Side Panel --- */
        #panel {
            width: 300px;
            min-width: 300px;
            height: 100vh;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            z-index: 200;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #panel.hidden {
            transform: translateX(100%);
        }

        /* Panel Header */
        .panel-header {
            margin-bottom: 28px;
        }
        .panel-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .panel-subtitle {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Section Labels */
        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
            margin-top: 6px;
        }

        /* Diagnostics */
        .diag-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .diag-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-mid);
            letter-spacing: 0.5px;
        }
        .diag-row .diag-val {
            font-weight: 600;
            color: var(--green);
            font-size: 13px;
        }
        .diag-row .diag-val.warn { color: #ffaa00; }
        .diag-row .diag-val.bad  { color: var(--red); }
        .diag-row .diag-val.accent { color: var(--accent); }

        /* Control Buttons */
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .ctrl-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text-mid);
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .ctrl-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255,255,255,0.12);
            color: var(--text);
        }
        .ctrl-btn.active {
            background: var(--btn-active);
            border-color: var(--btn-active-border);
            color: var(--accent);
        }
        .ctrl-btn .btn-icon {
            font-size: 14px;
            width: 18px;
            text-align: center;
        }

        /* Filter Preset Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }
        .preset-btn {
            padding: 10px 8px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text-dim);
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }
        .preset-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255,255,255,0.12);
            color: var(--text);
        }
        .preset-btn.active {
            background: var(--btn-active);
            border-color: var(--btn-active-border);
            color: var(--accent);
            font-weight: 600;
        }

        /* Keyboard Hints */
        .hints {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--panel-border);
        }
        .hint-row {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            line-height: 2;
        }
        .hint-row kbd {
            display: inline-block;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-mid);
            margin-right: 4px;
        }

        /* Toggle Panel Button (visible when panel is hidden) */
        #toggle-panel {
            position: fixed;
            top: 16px; right: 16px;
            width: 40px; height: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            color: var(--text-dim);
            font-size: 16px;
            transition: all 0.2s ease;
        }
        #toggle-panel:hover {
            background: var(--btn-hover);
            color: var(--text);
        }
        #toggle-panel.visible {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Initializing Camera & AI Models...</div>
    </div>

    <!-- Video Source (hidden) -->
    <video id="webcam" playsinline autoplay muted></video>

    <!-- Main Canvas Area -->
    <div id="canvas-area">
        <canvas id="output-canvas"></canvas>
    </div>

    <!-- Right Side Control Panel -->
    <div id="panel">
        <!-- Header -->
        <div class="panel-header">
            <div class="panel-title">SidLabs</div>
            <div class="panel-subtitle">Quantum Window Filter</div>
        </div>

        <!-- System Diagnostics -->
        <div class="section-label">System Diagnostics</div>
        <div class="diag-grid">
            <div class="diag-row">
                <span>FPS:</span>
                <span class="diag-val" id="fps-val">--</span>
            </div>
            <div class="diag-row">
                <span>Hands Tracked:</span>
                <span class="diag-val accent" id="hands-val">0 / 2</span>
            </div>
            <div class="diag-row">
                <span>Active Preset:</span>
                <span class="diag-val accent" id="active-preset">Neon Cyberpunk</span>
            </div>
        </div>

        <!-- Interactive Controls -->
        <div class="section-label">Interactive Controls</div>
        <div class="controls-group">
            <button class="ctrl-btn" id="btn-guides" onclick="toggleGuides()">
                <span class="btn-icon">◇</span>
                Guides: VISIBLE
            </button>
            <button class="ctrl-btn" id="btn-hide" onclick="togglePanel()">
                <span class="btn-icon">⊞</span>
                Hide Controls
            </button>
        </div>

        <!-- Filter Presets -->
        <div class="section-label">Filter Presets</div>
        <div class="preset-grid" id="preset-grid"></div>

        <!-- Keyboard Hints -->
        <div class="hints">
            <div class="hint-row"><kbd>SPACE</kbd> Cycle Presets</div>
            <div class="hint-row"><kbd>H</kbd> Toggle Guides</div>
            <div class="hint-row"><kbd>D</kbd> Toggle Controls</div>
        </div>
    </div>

    <!-- Toggle Panel Button -->
    <div id="toggle-panel" onclick="togglePanel()">☰</div>

    <script>
    'use strict';

    // --- DOM Elements ---
    const video       = document.getElementById('webcam');
    const canvas      = document.getElementById('output-canvas');
    const ctx         = canvas.getContext('2d');
    const overlay     = document.getElementById('loading-overlay');
    const fpsVal      = document.getElementById('fps-val');
    const handsValEl  = document.getElementById('hands-val');
    const activePresetEl = document.getElementById('active-preset');
    const panel       = document.getElementById('panel');
    const toggleBtn   = document.getElementById('toggle-panel');
    const presetGrid  = document.getElementById('preset-grid');
    const btnGuides   = document.getElementById('btn-guides');
    const canvasArea  = document.getElementById('canvas-area');

    // --- Canvas Sizing ---
    function resize() {
        canvas.width  = canvasArea.clientWidth;
        canvas.height = canvasArea.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // =============================================
    //  10 GPU FILTER PRESETS
    // =============================================
    const filters = [
        {
            name: 'Neon Cyberpunk',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(2.2) contrast(1.4) brightness(1.1) hue-rotate(200deg)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 120, 255, 0.08)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Film Noir',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'grayscale(1) contrast(1.8) brightness(0.85)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgba(20, 15, 10, 0.15)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Retrowave',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(1.8) contrast(1.2) hue-rotate(280deg) brightness(1.05)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createLinearGradient(x, y, x, y + h);
                grad.addColorStop(0, 'rgba(255, 0, 180, 0.06)');
                grad.addColorStop(1, 'rgba(100, 0, 255, 0.08)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Deep Ocean',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(1.4) contrast(1.1) hue-rotate(160deg) brightness(0.9)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 255, 200, 0.04)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Infrared',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(2.5) contrast(1.6) hue-rotate(330deg) brightness(1.15)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createRadialGradient(x+w/2, y+h/2, 0, x+w/2, y+h/2, Math.max(w,h)/2);
                grad.addColorStop(0, 'rgba(255, 60, 0, 0.06)');
                grad.addColorStop(1, 'rgba(0, 0, 80, 0.04)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Holographic',
            apply(ctx, v, x, y, w, h) {
                const t = performance.now() * 0.001;
                const hue = (t * 40) % 360;
                ctx.filter = `saturate(1.6) contrast(1.15) brightness(1.1) hue-rotate(${hue}deg)`;
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Anime Cel',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(2.0) contrast(1.7) brightness(1.15)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgba(255, 240, 220, 0.06)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Frost Crystal',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(0.4) contrast(1.2) brightness(1.3) hue-rotate(190deg)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(180, 220, 255, 0.06)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Gold Luxury',
            apply(ctx, v, x, y, w, h) {
                ctx.filter = 'saturate(1.3) contrast(1.2) brightness(1.05) sepia(0.5)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createLinearGradient(x, y, x + w, y + h);
                grad.addColorStop(0, 'rgba(255, 200, 80, 0.05)');
                grad.addColorStop(1, 'rgba(200, 150, 50, 0.04)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Acid Trip',
            apply(ctx, v, x, y, w, h) {
                const t = performance.now() * 0.002;
                const hue = (t * 90) % 360;
                ctx.filter = `saturate(3.0) contrast(1.5) brightness(1.2) hue-rotate(${hue}deg)`;
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 255, 100, 0.03)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        }
    ];

    let currentFilter = 0;

    // Build preset buttons
    filters.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
        btn.textContent = f.name;
        btn.dataset.index = i;
        btn.addEventListener('click', () => setFilter(i));
        presetGrid.appendChild(btn);
    });

    function setFilter(idx) {
        currentFilter = idx;
        activePresetEl.textContent = filters[idx].name;
        document.querySelectorAll('.preset-btn').forEach((b, i) => {
            b.classList.toggle('active', i === idx);
        });
    }

    // =============================================
    //  PORTAL STATE & SMOOTH MOTION
    // =============================================
    let portalCx = 0, portalCy = 0, portalR = 0;
    let lastHand1 = null, lastHand2 = null;
    let lastTwoHandsTime = 0;
    let showHelpers = true;

    function wavyCirclePath(cx, cy, r, t) {
        const pts = 120;
        const path = new Path2D();
        for (let i = 0; i <= pts; i++) {
            const a = (i / pts) * Math.PI * 2;
            const wave = Math.sin(a * 6 + t * 2.5) * (r * 0.035)
                       + Math.sin(a * 3 - t * 1.8) * (r * 0.025);
            const rr = r + wave;
            const px = cx + Math.cos(a) * rr;
            const py = cy + Math.sin(a) * rr;
            if (i === 0) path.moveTo(px, py);
            else path.lineTo(px, py);
        }
        path.closePath();
        return path;
    }

    // =============================================
    //  UI TOGGLE FUNCTIONS
    // =============================================
    function toggleGuides() {
        showHelpers = !showHelpers;
        btnGuides.textContent = '';
        btnGuides.innerHTML = `<span class="btn-icon">◇</span> Guides: ${showHelpers ? 'VISIBLE' : 'HIDDEN'}`;
        btnGuides.classList.toggle('active', showHelpers);
    }

    function togglePanel() {
        const isHidden = panel.classList.toggle('hidden');
        toggleBtn.classList.toggle('visible', isHidden);
        setTimeout(resize, 350);
    }

    // =============================================
    //  MEDIAPIPE INITIALIZATION
    // =============================================
    let latestResults = null;
    let hands = null;

    function initMediaPipe() {
        try {
            hands = new Hands({
                locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            hands.onResults((r) => { latestResults = r; });
        } catch (e) {
            console.error('MediaPipe init error:', e);
        }
    }

    if (typeof Hands !== 'undefined') initMediaPipe();
    else window.addEventListener('load', initMediaPipe);

    // =============================================
    //  MAIN 60 FPS RENDER LOOP
    // =============================================
    let frameCount = 0, fpsDisplay = 0, fpsLast = performance.now();

    function renderScene() {
        const W = canvas.width, H = canvas.height;
        const t = performance.now() * 0.001;

        ctx.clearRect(0, 0, W, H);

        if (video.readyState >= 2) {
            const vw = video.videoWidth, vh = video.videoHeight;
            const scale = Math.max(W / vw, H / vh);
            const dw = vw * scale, dh = vh * scale;
            const dx = (W - dw) / 2, dy = (H - dh) / 2;

            ctx.save();
            ctx.translate(W, 0);
            ctx.scale(-1, 1);

            // Process hand landmarks
            const handsData = [];
            if (latestResults && latestResults.multiHandLandmarks) {
                for (const lm of latestResults.multiHandLandmarks) {
                    const ix = lm[8], tx = lm[4];
                    const pinchX = W - ((ix.x + tx.x) / 2) * W;
                    const pinchY = ((ix.y + tx.y) / 2) * H;
                    const indexX = W - ix.x * W;
                    const indexY = ix.y * H;
                    const thumbX = W - tx.x * W;
                    const thumbY = tx.y * H;
                    const dist = Math.hypot(indexX - thumbX, indexY - thumbY);
                    handsData.push({ pinch: {x: pinchX, y: pinchY}, dist });
                }
                handsData.sort((a, b) => a.pinch.x - b.pinch.x);
            }

            if (handsValEl) handsValEl.textContent = handsData.length + ' / 2';

            // Portal solver
            let hasPortal = false;
            if (handsData.length >= 1) {
                let tCx, tCy, tR;

                if (handsData.length >= 2) {
                    const p1 = handsData[0].pinch, p2 = handsData[1].pinch;
                    tCx = (p1.x + p2.x) / 2;
                    tCy = (p1.y + p2.y) / 2;
                    tR = Math.max(100, Math.min(650, Math.hypot(p1.x-p2.x, p1.y-p2.y) / 1.4));
                    lastHand1 = {...p1}; lastHand2 = {...p2};
                    lastTwoHandsTime = Date.now();
                } else {
                    const p = handsData[0].pinch;
                    const dL = lastHand1 ? Math.hypot(p.x-lastHand1.x, p.y-lastHand1.y) : Infinity;
                    const dR = lastHand2 ? Math.hypot(p.x-lastHand2.x, p.y-lastHand2.y) : Infinity;
                    const missing = (dL < dR) ? lastHand2 : lastHand1;

                    if (Date.now() - lastTwoHandsTime < 500 && missing) {
                        tCx = (p.x + missing.x) / 2;
                        tCy = (p.y + missing.y) / 2;
                        tR = Math.max(100, Math.min(650, Math.hypot(p.x-missing.x, p.y-missing.y) / 1.4));
                    } else {
                        tCx = p.x; tCy = p.y;
                        tR = Math.max(80, Math.min(300, handsData[0].dist * 3.5));
                    }
                }

                if (portalCx === 0 && portalCy === 0) {
                    portalCx = tCx; portalCy = tCy; portalR = tR;
                } else {
                    portalCx += (tCx - portalCx) * 0.22;
                    portalCy += (tCy - portalCy) * 0.22;
                    portalR  += (tR  - portalR)  * 0.22;
                }
                hasPortal = true;
            }

            if (hasPortal && portalR > 10) {
                const mirCx = W - portalCx;
                const mirCy = portalCy;

                // Dark outside
                ctx.filter = 'brightness(0.25) saturate(0.3)';
                ctx.drawImage(video, dx, dy, dw, dh);
                ctx.filter = 'none';

                // Filtered portal
                const portalPath = wavyCirclePath(mirCx, mirCy, portalR, t);
                ctx.save();
                ctx.clip(portalPath);
                filters[currentFilter].apply(ctx, video, dx, dy, dw, dh);
                ctx.restore();

                // Portal edge glow
                ctx.strokeStyle = `rgba(201, 168, 124, ${0.3 + Math.sin(t * 2) * 0.15})`;
                ctx.lineWidth = 2;
                ctx.stroke(portalPath);

                // Concentric rings
                for (let i = 1; i <= 3; i++) {
                    const ringR = portalR + 20 * i + Math.sin(t * 1.5 + i) * 5;
                    ctx.beginPath();
                    ctx.arc(mirCx, mirCy, ringR, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(201, 168, 124, ${0.12 - i * 0.03})`;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Helpers: diamond reticles & web lines
                if (showHelpers && latestResults && latestResults.multiHandLandmarks) {
                    const tipsIdx = [4, 8, 12, 16, 20];
                    const allTips = [];

                    for (let hIdx = 0; hIdx < latestResults.multiHandLandmarks.length; hIdx++) {
                        const lm = latestResults.multiHandLandmarks[hIdx];
                        for (const id of tipsIdx) {
                            const px = lm[id].x * W;
                            const py = lm[id].y * H;
                            allTips.push({x: px, y: py, hand: hIdx});

                            ctx.save();
                            ctx.translate(px, py);
                            ctx.rotate(Math.PI / 4);
                            ctx.strokeStyle = 'rgba(201, 168, 124, 0.7)';
                            ctx.lineWidth = 1.2;
                            ctx.setLineDash([2, 3]);
                            ctx.strokeRect(-6, -6, 12, 12);
                            ctx.setLineDash([]);
                            ctx.restore();

                            ctx.fillStyle = '#fff';
                            ctx.beginPath();
                            ctx.arc(px, py, 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    for (let i = 0; i < allTips.length; i++) {
                        for (let j = i + 1; j < allTips.length; j++) {
                            const a = allTips[i], b = allTips[j];
                            const d = Math.hypot(a.x - b.x, a.y - b.y);
                            if (d < 400) {
                                const alpha = (1 - d / 400) * 0.8;
                                const cross = a.hand !== b.hand;
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = cross
                                    ? `rgba(0, 212, 255, ${alpha})`
                                    : `rgba(238, 34, 85, ${alpha * 0.5})`;
                                ctx.lineWidth = cross ? 1.6 : 0.8;
                                ctx.stroke();
                            }
                        }
                    }
                }
            } else {
                ctx.drawImage(video, dx, dy, dw, dh);
            }

            ctx.restore();
        }

        // FPS
        frameCount++;
        const now = performance.now();
        if (now - fpsLast >= 500) {
            fpsDisplay = (frameCount * 1000) / (now - fpsLast);
            frameCount = 0;
            fpsLast = now;
            if (fpsVal) {
                fpsVal.textContent = fpsDisplay.toFixed(1);
                fpsVal.className = 'diag-val' + (fpsDisplay >= 55 ? '' : fpsDisplay >= 30 ? ' warn' : ' bad');
            }
        }

        requestAnimationFrame(renderScene);
    }

    requestAnimationFrame(renderScene);

    // =============================================
    //  CAMERA & MEDIAPIPE FRAME LOOP
    // =============================================
    const inputCanvas = document.createElement('canvas');
    inputCanvas.width = 320; inputCanvas.height = 240;
    const inputCtx = inputCanvas.getContext('2d', { willReadFrequently: true });
    let processing = false;

    async function processFrame() {
        if (hands && video.readyState >= 2 && !processing) {
            processing = true;
            try {
                inputCtx.drawImage(video, 0, 0, 320, 240);
                await hands.send({ image: inputCanvas });
            } catch (e) { /* recover */ }
            processing = false;
        }
        requestAnimationFrame(processFrame);
    }

    async function startCamera() {
        try {
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: {ideal:1280}, height: {ideal:720}, frameRate: {ideal:30} }
                });
            } catch (_) {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }

            video.srcObject = stream;
            await new Promise(r => {
                if (video.readyState >= 2) { video.play().then(r).catch(r); }
                else { video.onloadedmetadata = () => video.play().then(r).catch(r); }
            });

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            requestAnimationFrame(processFrame);
        } catch (err) {
            console.error('Camera failed:', err);
            document.getElementById('loading-text').innerHTML =
                '<span style="color:#ff4444">CAMERA ACCESS FAILED.<br>ALLOW CAMERA & REFRESH.</span>';
            document.querySelector('.spinner').style.display = 'none';
        }
    }

    startCamera();

    // =============================================
    //  KEYBOARD CONTROLS
    // =============================================
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === ' ' || key === 'f') {
            e.preventDefault();
            setFilter((currentFilter + 1) % filters.length);
        }
        if (key === 'h') toggleGuides();
        if (key === 'd') togglePanel();
    });

    </script>
</body>
</html>
