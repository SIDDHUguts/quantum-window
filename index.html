<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidLabs Quantum Window — Holo Filter Lens</title>
    <meta name="description" content="SidLabs Quantum Window — Real-time AI hand-tracked holographic filter lens with 10 GPU shader presets.">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #0a0a10;
            --panel-bg: rgba(18, 18, 28, 0.88);
            --panel-border: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.03);
            --accent: #c9a87c;
            --accent-dim: rgba(201,168,124,0.5);
            --accent-glow: rgba(201,168,124,0.25);
            --red: #ff4444;
            --green: #00ff88;
            --cyan: #00d4ff;
            --text: #f0f0f5;
            --text-dim: #6a6a82;
            --text-mid: #9a9ab0;
            --btn-bg: rgba(255,255,255,0.04);
            --btn-border: rgba(255,255,255,0.08);
            --btn-hover: rgba(255,255,255,0.08);
            --btn-active: rgba(201,168,124,0.15);
            --btn-active-border: rgba(201,168,124,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw; height: 100vh;
            cursor: crosshair;
            display: flex;
        }

        /* --- Loading Overlay --- */
        #loading-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 2.5px solid rgba(255,255,255,0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            font-size: 12px; font-weight: 400;
            letter-spacing: 3px; text-transform: uppercase;
            color: var(--text-dim);
        }

        /* --- Main Canvas Area --- */
        #canvas-area {
            flex: 1; position: relative;
            background: #000;
            overflow: hidden;
        }
        #output-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
        }
        video#webcam { display: none; }

        /* --- Right Side Panel --- */
        #panel {
            width: 300px;
            min-width: 300px;
            height: 100vh;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            z-index: 200;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #panel.hidden {
            transform: translateX(100%);
        }

        /* Panel Header */
        .panel-header {
            margin-bottom: 28px;
        }
        .panel-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .panel-subtitle {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Section Labels */
        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
            margin-top: 6px;
        }

        /* Diagnostics */
        .diag-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .diag-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-mid);
            letter-spacing: 0.5px;
        }
        .diag-row .diag-val {
            font-weight: 600;
            color: var(--green);
            font-size: 13px;
        }
        .diag-row .diag-val.warn { color: #ffaa00; }
        .diag-row .diag-val.bad  { color: var(--red); }
        .diag-row .diag-val.accent { color: var(--accent); }

        /* Control Buttons */
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .ctrl-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text-mid);
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .ctrl-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255,255,255,0.12);
            color: var(--text);
        }
        .ctrl-btn.active {
            background: var(--btn-active);
            border-color: var(--btn-active-border);
            color: var(--accent);
        }
        .ctrl-btn .btn-icon {
            font-size: 14px;
            width: 18px;
            text-align: center;
        }

        /* Filter Preset Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }
        .preset-btn {
            padding: 10px 8px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text-dim);
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }
        .preset-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255,255,255,0.12);
            color: var(--text);
        }
        .preset-btn.active {
            background: var(--btn-active);
            border-color: var(--btn-active-border);
            color: var(--accent);
            font-weight: 600;
        }

        /* Keyboard Hints */
        .hints {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--panel-border);
        }
        .hint-row {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            line-height: 2;
        }
        .hint-row kbd {
            display: inline-block;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-mid);
            margin-right: 4px;
        }

        /* Toggle Panel Button (visible when panel is hidden) */
        #toggle-panel {
            position: fixed;
            top: 16px; right: 16px;
            width: 40px; height: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            color: var(--text-dim);
            font-size: 16px;
            transition: all 0.2s ease;
        }
        #toggle-panel:hover {
            background: var(--btn-hover);
            color: var(--text);
        }
        #toggle-panel.visible {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Initializing Camera & AI Models...</div>
    </div>

    <!-- Video Source (hidden) -->
    <video id="webcam" playsinline autoplay muted></video>

    <!-- Main Canvas Area -->
    <div id="canvas-area">
        <canvas id="output-canvas"></canvas>
    </div>

    <!-- Right Side Control Panel -->
    <div id="panel">
        <!-- Header -->
        <div class="panel-header">
            <div class="panel-title">SidLabs</div>
            <div class="panel-subtitle">Quantum Window Filter</div>
        </div>

        <!-- System Diagnostics -->
        <div class="section-label">System Diagnostics</div>
        <div class="diag-grid">
            <div class="diag-row">
                <span>FPS:</span>
                <span class="diag-val" id="fps-val">--</span>
            </div>
            <div class="diag-row">
                <span>Hands Tracked:</span>
                <span class="diag-val accent" id="hands-val">0 / 2</span>
            </div>
            <div class="diag-row">
                <span>Active Preset:</span>
                <span class="diag-val accent" id="active-preset">Neon Cyberpunk</span>
            </div>
        </div>

        <!-- Interactive Controls -->
        <div class="section-label">Interactive Controls</div>
        <div class="controls-group">
            <button class="ctrl-btn" id="btn-guides" onclick="toggleGuides()">
                <span class="btn-icon">◇</span>
                Guides: VISIBLE
            </button>
            <button class="ctrl-btn" id="btn-hide" onclick="togglePanel()">
                <span class="btn-icon">⊞</span>
                Hide Controls
            </button>
        </div>

        <!-- Filter Presets -->
        <div class="section-label">Filter Presets</div>
        <div class="preset-grid" id="preset-grid"></div>

        <!-- Keyboard Hints -->
        <div class="hints">
            <div class="hint-row"><kbd>SPACE</kbd> Cycle Presets</div>
            <div class="hint-row"><kbd>H</kbd> Toggle Guides</div>
            <div class="hint-row"><kbd>D</kbd> Toggle Controls</div>
        </div>
    </div>

    <!-- Toggle Panel Button -->
    <div id="toggle-panel" onclick="togglePanel()">☰</div>

    <script>
    'use strict';

    // --- DOM Elements ---
    const video       = document.getElementById('webcam');
    const canvas      = document.getElementById('output-canvas');
    const ctx         = canvas.getContext('2d');
    const overlay     = document.getElementById('loading-overlay');
    const fpsVal      = document.getElementById('fps-val');
    const handsValEl  = document.getElementById('hands-val');
    const activePresetEl = document.getElementById('active-preset');
    const panel       = document.getElementById('panel');
    const toggleBtn   = document.getElementById('toggle-panel');
    const presetGrid  = document.getElementById('preset-grid');
    const btnGuides   = document.getElementById('btn-guides');
    const canvasArea  = document.getElementById('canvas-area');

    // --- Canvas Sizing ---
    function resize() {
        canvas.width  = canvasArea.clientWidth;
        canvas.height = canvasArea.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // =============================================
    //  10 RADICALLY DISTINCT VISUAL SHADERS
    // =============================================
    const filters = [
        {
            name: 'Cyber Matrix',
            apply(ctx, v, x, y, w, h) {
                // 1. Matrix Digital Terminal Code Streams
                ctx.filter = 'grayscale(1) contrast(2.2) brightness(0.8)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';
                
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 255, 100, 0.35)';
                ctx.fillRect(x, y, w, h);

                const t = performance.now() * 0.003;
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 12px monospace';
                const cols = 22;
                const colW = w / cols;
                for (let c = 0; c < cols; c++) {
                    const speed = ((c % 4) + 2) * 45;
                    const dropY = (t * speed + c * 43) % (h + 80) - 40;
                    const char = String.fromCharCode(0x30A0 + Math.floor((c * 19 + t * 8) % 96));
                    ctx.fillText(char, x + c * colW + 2, y + dropY);
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Thermal Predator',
            apply(ctx, v, x, y, w, h) {
                // 2. High-contrast false-color heat vision map
                ctx.filter = 'saturate(4.0) contrast(2.5) hue-rotate(300deg) brightness(1.25)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                const rad = ctx.createRadialGradient(x + w/2, y + h/2, 0, x + w/2, y + h/2, Math.max(w,h)/1.4);
                rad.addColorStop(0, 'rgba(255, 230, 0, 0.25)');
                rad.addColorStop(0.5, 'rgba(255, 0, 50, 0.2)');
                rad.addColorStop(1, 'rgba(40, 0, 150, 0.35)');
                ctx.fillStyle = rad;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Anime Ink Sketch',
            apply(ctx, v, x, y, w, h) {
                // 3. Pure Manga Comic Book B&W Ink Line Art
                ctx.filter = 'grayscale(1) contrast(3.5) brightness(0.85)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgba(245, 240, 225, 0.18)';
                ctx.fillRect(x, y, w, h);

                // Halftone grid dots
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                for (let px = x; px < x + w; px += 8) {
                    for (let py = y; py < y + h; py += 8) {
                        ctx.beginPath();
                        ctx.arc(px, py, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Vaporwave Synthwave',
            apply(ctx, v, x, y, w, h) {
                // 4. Hot Magenta/Purple Dual-Tone & Horizon Grid
                ctx.filter = 'saturate(2.5) contrast(1.4) hue-rotate(270deg) brightness(1.1)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createLinearGradient(x, y, x, y + h);
                grad.addColorStop(0, 'rgba(255, 0, 180, 0.25)');
                grad.addColorStop(0.6, 'rgba(120, 0, 255, 0.15)');
                grad.addColorStop(1, 'rgba(0, 230, 255, 0.25)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);

                // Horizon grid lines
                const t = performance.now() * 0.002;
                ctx.strokeStyle = 'rgba(255, 0, 220, 0.4)';
                ctx.lineWidth = 1.2;
                const horizon = y + h * 0.5;
                const offset = (t * 25) % 16;
                for (let gy = horizon + offset; gy < y + h; gy += 16) {
                    ctx.beginPath();
                    ctx.moveTo(x, gy);
                    ctx.lineTo(x + w, gy);
                    ctx.stroke();
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'RGB Glitch Tearing',
            apply(ctx, v, x, y, w, h) {
                // 5. Chromatic Channel Displacement & Tearing Artifacts
                const t = performance.now() * 0.006;
                const shift = Math.sin(t * 7) * 14;

                ctx.save();
                ctx.filter = 'contrast(1.5) saturate(3.0) hue-rotate(0deg)';
                ctx.drawImage(v, x - shift, y, w, h);
                ctx.restore();

                ctx.globalCompositeOperation = 'screen';
                ctx.filter = 'contrast(1.5) saturate(3.0) hue-rotate(180deg)';
                ctx.drawImage(v, x + shift, y, w, h);
                ctx.filter = 'none';

                if (Math.random() < 0.35) {
                    const gy = y + Math.random() * h;
                    const gh = 6 + Math.random() * 14;
                    ctx.fillStyle = 'rgba(255, 0, 100, 0.45)';
                    ctx.fillRect(x, gy, w, gh);
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Deep Ocean Blue',
            apply(ctx, v, x, y, w, h) {
                // 6. Deep Cyan Aquatic Bioluminescence
                ctx.filter = 'saturate(1.6) contrast(1.2) hue-rotate(150deg) brightness(0.85)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 220, 255, 0.15)';
                ctx.fillRect(x, y, w, h);

                // Aquatic floating bubbles
                const t = performance.now() * 0.002;
                ctx.fillStyle = 'rgba(0, 255, 220, 0.4)';
                for (let b = 0; b < 15; b++) {
                    const bx = x + ((b * 83 + Math.sin(t + b) * 20 + w) % w);
                    const by = y + ((h - (t * 30 + b * 50) % (h + 40)));
                    ctx.beginPath();
                    ctx.arc(bx, by, (b % 4) + 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Molten Gold',
            apply(ctx, v, x, y, w, h) {
                // 7. Metallic Champagne Gold Sepia & Gold Dust
                ctx.filter = 'saturate(1.5) contrast(1.3) sepia(0.9) brightness(1.1)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createLinearGradient(x, y, x + w, y + h);
                grad.addColorStop(0, 'rgba(255, 200, 50, 0.2)');
                grad.addColorStop(0.5, 'rgba(255, 140, 0, 0.15)');
                grad.addColorStop(1, 'rgba(255, 230, 100, 0.25)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);

                // Sparkling gold dust
                const t = performance.now() * 0.003;
                ctx.fillStyle = 'rgba(255, 220, 120, 0.6)';
                for (let g = 0; g < 18; g++) {
                    const gx = x + ((g * 97 + t * 15) % w);
                    const gy = y + ((g * 47 + t * 25) % h);
                    ctx.beginPath();
                    ctx.arc(gx, gy, (g % 3) + 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Rainbow Prism',
            apply(ctx, v, x, y, w, h) {
                // 8. 360 Spectrum Iridescent Dispersion
                const t = performance.now() * 0.0015;
                const hue = (t * 75) % 360;
                ctx.filter = `saturate(2.2) contrast(1.3) brightness(1.15) hue-rotate(${hue}deg)`;
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                const rainbow = ctx.createLinearGradient(x, y, x + w, y + h);
                rainbow.addColorStop(0, `hsla(${(hue)%360}, 100%, 50%, 0.15)`);
                rainbow.addColorStop(0.33, `hsla(${(hue+120)%360}, 100%, 50%, 0.15)`);
                rainbow.addColorStop(0.66, `hsla(${(hue+240)%360}, 100%, 50%, 0.15)`);
                rainbow.addColorStop(1, `hsla(${(hue+360)%360}, 100%, 50%, 0.15)`);
                ctx.fillStyle = rainbow;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Vintage Film Noir',
            apply(ctx, v, x, y, w, h) {
                // 9. B&W Grainy Movie Camera with Vignette
                ctx.filter = 'grayscale(1) contrast(2.0) brightness(0.85)';
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'multiply';
                const vig = ctx.createRadialGradient(x + w/2, y + h/2, w * 0.2, x + w/2, y + h/2, Math.max(w,h) * 0.7);
                vig.addColorStop(0, 'rgba(255, 255, 255, 1)');
                vig.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
                ctx.fillStyle = vig;
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        },
        {
            name: 'Acid Psychedelic',
            apply(ctx, v, x, y, w, h) {
                // 10. High-energy Neon Magenta/Green Color Warp
                const t = performance.now() * 0.003;
                const hue = (t * 120) % 360;
                ctx.filter = `saturate(3.5) contrast(1.6) brightness(1.2) hue-rotate(${hue}deg)`;
                ctx.drawImage(v, x, y, w, h);
                ctx.filter = 'none';

                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(0, 255, 128, 0.06)';
                ctx.fillRect(x, y, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
        }
    ];

    let currentFilter = 0;

    // Build preset buttons
    filters.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
        btn.textContent = f.name;
        btn.dataset.index = i;
        btn.addEventListener('click', () => setFilter(i));
        presetGrid.appendChild(btn);
    });

    function setFilter(idx) {
        currentFilter = idx;
        activePresetEl.textContent = filters[idx].name;
        document.querySelectorAll('.preset-btn').forEach((b, i) => {
            b.classList.toggle('active', i === idx);
        });
    }

    // =============================================
    //  HAND POLYGON STATE
    // =============================================
    let showHelpers = true;
    let persistedHands = [null, null]; // [leftHand, rightHand] persistent storage

    // Convex hull (Graham scan) for creating the mask polygon from fingertips
    function convexHull(points) {
        if (points.length < 3) return points.slice();
        points = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        const cross = (O, A, B) => (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x);
        const lower = [];
        for (const p of points) {
            while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
            lower.push(p);
        }
        const upper = [];
        for (let i = points.length - 1; i >= 0; i--) {
            const p = points[i];
            while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
            upper.push(p);
        }
        upper.pop(); lower.pop();
        return lower.concat(upper);
    }

    // Smooth polygon points with lerp
    let smoothedHull = null;

    function lerpPoints(prev, next, factor) {
        if (!prev || prev.length !== next.length) return next.slice();
        return next.map((p, i) => ({
            x: prev[i].x + (p.x - prev[i].x) * factor,
            y: prev[i].y + (p.y - prev[i].y) * factor
        }));
    }

    // =============================================
    //  PINCH-TO-SWITCH FILTER GESTURE
    // =============================================
    let pinchWasActive = false;
    let pinchCooldown = 0;

    function detectPinch(landmarks, W, H) {
        // Index tip (8) to thumb tip (4) distance
        const ix = landmarks[8], tx = landmarks[4];
        const dist = Math.hypot((ix.x - tx.x) * W, (ix.y - tx.y) * H);
        return dist < 35; // pinch threshold in pixels
    }

    // =============================================
    //  FINGERTIP PARTICLE SYSTEM
    // =============================================
    const particles = [];
    const MAX_PARTICLES = 200;

    function spawnParticle(x, y, type) {
        if (particles.length >= MAX_PARTICLES) particles.shift();
        const angle = Math.random() * Math.PI * 2;
        const speed = type === 'shockwave' ? (3 + Math.random() * 6) : (0.5 + Math.random() * 2);
        const colors = ['#c9a87c', '#00d4ff', '#ff3366', '#00ff88', '#ff8800', '#aa44ff'];
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (type === 'trail' ? 1 : 0),
            life: 1.0,
            decay: type === 'shockwave' ? 0.025 : 0.018,
            size: type === 'shockwave' ? (2 + Math.random() * 4) : (1.5 + Math.random() * 2.5),
            color: colors[Math.floor(Math.random() * colors.length)],
            type
        });
    }

    function updateAndDrawParticles(ctx) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) { particles.splice(i, 1); continue; }

            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // =============================================
    //  CLAP SHOCKWAVE SYSTEM
    // =============================================
    const shockwaves = [];

    function spawnShockwave(x, y) {
        shockwaves.push({ x, y, radius: 10, maxRadius: 400, life: 1.0 });
        // Burst of particles
        for (let i = 0; i < 40; i++) spawnParticle(x, y, 'shockwave');
    }

    let prevHandsCenterDist = Infinity;

    function drawShockwaves(ctx) {
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const s = shockwaves[i];
            s.radius += 8;
            s.life -= 0.025;
            if (s.life <= 0) { shockwaves.splice(i, 1); continue; }

            ctx.save();
            ctx.globalAlpha = s.life * 0.6;
            ctx.strokeStyle = '#c9a87c';
            ctx.lineWidth = 3 * s.life;
            ctx.shadowColor = '#c9a87c';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.stroke();

            // Secondary ring
            ctx.globalAlpha = s.life * 0.3;
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 1.5 * s.life;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius * 0.7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    // =============================================
    //  FINGER LIGHT PAINTING
    // =============================================
    const lightTrails = []; // { points: [{x,y}], color, hand }
    const TRAIL_MAX_LENGTH = 80;

    function updateLightTrails(allTips) {
        // Only use index fingertips (every 2nd tip = index finger = tips at position 1 per hand)
        const indexTips = allTips.filter((_, i) => i % 5 === 1); // index finger is 2nd tip (8)

        // Ensure we have a trail per index finger
        while (lightTrails.length < indexTips.length) {
            lightTrails.push({ points: [], color: lightTrails.length === 0 ? '#00d4ff' : '#ff3366' });
        }
        while (lightTrails.length > indexTips.length && lightTrails.length > 0) {
            lightTrails.pop();
        }

        for (let i = 0; i < indexTips.length; i++) {
            lightTrails[i].points.push({ x: indexTips[i].x, y: indexTips[i].y });
            if (lightTrails[i].points.length > TRAIL_MAX_LENGTH) lightTrails[i].points.shift();
        }
    }

    function drawLightTrails(ctx) {
        for (const trail of lightTrails) {
            if (trail.points.length < 2) continue;
            ctx.save();
            for (let i = 1; i < trail.points.length; i++) {
                const alpha = i / trail.points.length;
                const width = alpha * 3.5;
                ctx.beginPath();
                ctx.moveTo(trail.points[i-1].x, trail.points[i-1].y);
                ctx.lineTo(trail.points[i].x, trail.points[i].y);
                ctx.strokeStyle = trail.color;
                ctx.globalAlpha = alpha * 0.8;
                ctx.lineWidth = width;
                ctx.shadowColor = trail.color;
                ctx.shadowBlur = 12;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            ctx.restore();
        }
    }
    function toggleGuides() {
        showHelpers = !showHelpers;
        btnGuides.textContent = '';
        btnGuides.innerHTML = `<span class="btn-icon">◇</span> Guides: ${showHelpers ? 'VISIBLE' : 'HIDDEN'}`;
        btnGuides.classList.toggle('active', showHelpers);
    }

    function togglePanel() {
        const isHidden = panel.classList.toggle('hidden');
        toggleBtn.classList.toggle('visible', isHidden);
        setTimeout(resize, 350);
    }

    // =============================================
    //  MEDIAPIPE INITIALIZATION
    // =============================================
    let latestResults = null;
    let hands = null;

    function initMediaPipe() {
        try {
            hands = new Hands({
                locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0,
                minDetectionConfidence: 0.4,
                minTrackingConfidence: 0.4
            });
            hands.onResults((r) => { latestResults = r; });
        } catch (e) {
            console.error('MediaPipe init error:', e);
        }
    }

    if (typeof Hands !== 'undefined') initMediaPipe();
    else window.addEventListener('load', initMediaPipe);

    // =============================================
    //  MAIN 60 FPS RENDER LOOP
    // =============================================
    let frameCount = 0, fpsDisplay = 0, fpsLast = performance.now();

    function renderScene() {
        const W = canvas.width, H = canvas.height;
        const t = performance.now() * 0.001;

        ctx.clearRect(0, 0, W, H);

        if (video.readyState >= 2) {
            const vw = video.videoWidth, vh = video.videoHeight;
            const scale = Math.max(W / vw, H / vh);
            const dw = vw * scale, dh = vh * scale;
            const dx = (W - dw) / 2, dy = (H - dh) / 2;

            ctx.save();
            ctx.translate(W, 0);
            ctx.scale(-1, 1);

            // Collect ALL landmark points from all hands with persistence
            const allPoints = [];
            const allTips = [];
            const tipsIdx = [4, 8, 12, 16, 20];
            // Key structural landmarks: wrist(0), thumb(1,4), index(5,8), middle(9,12), ring(13,16), pinky(17,20)
            const hullIdx = [0, 1, 4, 5, 8, 9, 12, 13, 16, 17, 20];

            // Update persistent hand storage
            const now = Date.now();
            if (latestResults && latestResults.multiHandLandmarks) {
                const detected = latestResults.multiHandLandmarks;

                if (detected.length >= 2) {
                    // Both hands detected — sort left-to-right and store
                    const sorted = detected.slice().sort((a, b) => a[0].x - b[0].x);
                    persistedHands[0] = { lm: sorted[0], time: now };
                    persistedHands[1] = { lm: sorted[1], time: now };
                } else if (detected.length === 1) {
                    const lm = detected[0];
                    const cx = lm[0].x;
                    // Figure out which stored hand this is closest to
                    const d0 = persistedHands[0] ? Math.abs(cx - persistedHands[0].lm[0].x) : Infinity;
                    const d1 = persistedHands[1] ? Math.abs(cx - persistedHands[1].lm[0].x) : Infinity;
                    if (d0 <= d1) {
                        persistedHands[0] = { lm, time: now };
                    } else {
                        persistedHands[1] = { lm, time: now };
                    }
                }
            }

            // Build points from all persisted hands (within 600ms grace period)
            for (let hIdx = 0; hIdx < 2; hIdx++) {
                const ph = persistedHands[hIdx];
                if (!ph || now - ph.time > 600) continue;
                const lm = ph.lm;
                for (const id of hullIdx) {
                    allPoints.push({ x: lm[id].x * W, y: lm[id].y * H, hand: hIdx });
                }
                for (const id of tipsIdx) {
                    allTips.push({ x: lm[id].x * W, y: lm[id].y * H, hand: hIdx });
                }
            }

            const handCount = allPoints.length > 0 ? (allTips.length / 5) : 0;
            if (handsValEl) handsValEl.textContent = Math.round(handCount) + ' / 2';

            if (allPoints.length >= 3) {
                // Build convex hull polygon from hand landmarks
                let hull = convexHull(allPoints);

                // Smooth the hull over time
                smoothedHull = lerpPoints(smoothedHull, hull, 0.3);

                // Build path from smoothed hull
                const hullPath = new Path2D();
                for (let i = 0; i < smoothedHull.length; i++) {
                    if (i === 0) hullPath.moveTo(smoothedHull[i].x, smoothedHull[i].y);
                    else hullPath.lineTo(smoothedHull[i].x, smoothedHull[i].y);
                }
                hullPath.closePath();

                // Dark outside region (dimmed unfiltered video)
                ctx.filter = 'brightness(0.2) saturate(0.2)';
                ctx.drawImage(video, dx, dy, dw, dh);
                ctx.filter = 'none';

                // Filtered area inside the hand polygon
                ctx.save();
                ctx.clip(hullPath);
                filters[currentFilter].apply(ctx, video, dx, dy, dw, dh);
                ctx.restore();

                // Polygon edge glow
                ctx.save();
                ctx.strokeStyle = `rgba(201, 168, 124, ${0.4 + Math.sin(t * 2) * 0.15})`;
                ctx.lineWidth = 2;
                ctx.stroke(hullPath);
                ctx.restore();

                // Helpers: diamond reticles & web lines
                if (showHelpers) {
                    for (const tip of allTips) {
                        // Diamond reticle ◇
                        ctx.save();
                        ctx.translate(tip.x, tip.y);
                        ctx.rotate(Math.PI / 4);
                        ctx.strokeStyle = 'rgba(201, 168, 124, 0.7)';
                        ctx.lineWidth = 1.2;
                        ctx.setLineDash([2, 3]);
                        ctx.strokeRect(-6, -6, 12, 12);
                        ctx.setLineDash([]);
                        ctx.restore();

                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(tip.x, tip.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Web lines between fingertips
                    for (let i = 0; i < allTips.length; i++) {
                        for (let j = i + 1; j < allTips.length; j++) {
                            const a = allTips[i], b = allTips[j];
                            const d = Math.hypot(a.x - b.x, a.y - b.y);
                            if (d < 400) {
                                const alpha = (1 - d / 400) * 0.8;
                                const cross = a.hand !== b.hand;
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = cross
                                    ? `rgba(0, 212, 255, ${alpha})`
                                    : `rgba(238, 34, 85, ${alpha * 0.5})`;
                                ctx.lineWidth = cross ? 1.6 : 0.8;
                                ctx.stroke();
                            }
                        }
                    }
                }

                // --- PINCH GESTURE: detect pinch on any hand to switch filter ---
                if (latestResults && latestResults.multiHandLandmarks) {
                    const now2 = Date.now();
                    let anyPinch = false;
                    for (const lm of latestResults.multiHandLandmarks) {
                        if (detectPinch(lm, W, H)) anyPinch = true;
                    }
                    if (anyPinch && !pinchWasActive && now2 > pinchCooldown) {
                        setFilter((currentFilter + 1) % filters.length);
                        pinchCooldown = now2 + 600; // 600ms cooldown
                        // Pinch spark burst at pinch point
                        for (const lm of latestResults.multiHandLandmarks) {
                            const px = ((lm[8].x + lm[4].x) / 2) * W;
                            const py = ((lm[8].y + lm[4].y) / 2) * H;
                            for (let k = 0; k < 15; k++) spawnParticle(px, py, 'shockwave');
                        }
                    }
                    pinchWasActive = anyPinch;
                }

                // --- CLAP SHOCKWAVE: detect 2 hands coming together ---
                if (persistedHands[0] && persistedHands[1] &&
                    Date.now() - persistedHands[0].time < 200 &&
                    Date.now() - persistedHands[1].time < 200) {
                    const lm0 = persistedHands[0].lm, lm1 = persistedHands[1].lm;
                    const c0x = lm0[9].x * W, c0y = lm0[9].y * H;
                    const c1x = lm1[9].x * W, c1y = lm1[9].y * H;
                    const centerDist = Math.hypot(c0x - c1x, c0y - c1y);
                    if (prevHandsCenterDist > 80 && centerDist < 60) {
                        spawnShockwave((c0x + c1x) / 2, (c0y + c1y) / 2);
                    }
                    prevHandsCenterDist = centerDist;
                } else {
                    prevHandsCenterDist = Infinity;
                }

                // --- FINGERTIP PARTICLE TRAILS ---
                for (const tip of allTips) {
                    if (Math.random() < 0.4) spawnParticle(tip.x, tip.y, 'trail');
                }

                // --- LIGHT PAINTING ---
                updateLightTrails(allTips);

            } else {
                // No hands — show full unfiltered video
                smoothedHull = null;
                lightTrails.length = 0;
                ctx.drawImage(video, dx, dy, dw, dh);
            }

            // --- Draw all effects (AFTER mirror restore so they appear correct) ---
            ctx.restore();

            // Draw effects in screen space (non-mirrored)
            drawLightTrails(ctx);
            updateAndDrawParticles(ctx);
            drawShockwaves(ctx);
        }

        // FPS
        frameCount++;
        const now = performance.now();
        if (now - fpsLast >= 500) {
            fpsDisplay = (frameCount * 1000) / (now - fpsLast);
            frameCount = 0;
            fpsLast = now;
            if (fpsVal) {
                fpsVal.textContent = fpsDisplay.toFixed(1);
                fpsVal.className = 'diag-val' + (fpsDisplay >= 55 ? '' : fpsDisplay >= 30 ? ' warn' : ' bad');
            }
        }

        requestAnimationFrame(renderScene);
    }

    requestAnimationFrame(renderScene);

    // =============================================
    //  CAMERA & MEDIAPIPE FRAME LOOP
    // =============================================
    const inputCanvas = document.createElement('canvas');
    inputCanvas.width = 320; inputCanvas.height = 240;
    const inputCtx = inputCanvas.getContext('2d', { willReadFrequently: true });
    let processing = false;

    async function processFrame() {
        if (hands && video.readyState >= 2 && !processing) {
            processing = true;
            try {
                inputCtx.drawImage(video, 0, 0, 320, 240);
                await hands.send({ image: inputCanvas });
            } catch (e) { /* recover */ }
            processing = false;
        }
        requestAnimationFrame(processFrame);
    }

    async function startCamera() {
        try {
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: {ideal:1280}, height: {ideal:720}, frameRate: {ideal:30} }
                });
            } catch (_) {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }

            video.srcObject = stream;
            await new Promise(r => {
                if (video.readyState >= 2) { video.play().then(r).catch(r); }
                else { video.onloadedmetadata = () => video.play().then(r).catch(r); }
            });

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            requestAnimationFrame(processFrame);
        } catch (err) {
            console.error('Camera failed:', err);
            document.getElementById('loading-text').innerHTML =
                '<span style="color:#ff4444">CAMERA ACCESS FAILED.<br>ALLOW CAMERA & REFRESH.</span>';
            document.querySelector('.spinner').style.display = 'none';
        }
    }

    startCamera();

    // =============================================
    //  KEYBOARD CONTROLS
    // =============================================
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === ' ' || key === 'f') {
            e.preventDefault();
            setFilter((currentFilter + 1) % filters.length);
        }
        if (key === 'h') toggleGuides();
        if (key === 'd') togglePanel();
    });

    </script>
</body>
</html>
